[project]
name = "python-scene-handoff"
version = "0.2.0"
description = "Lightweight handoff from Python-generated time-varying 3D scenes to DCC tools via glTF and USD."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pyvista>=0.46",
]

[project.optional-dependencies]
usd = [
  "usd-core>=26.3",
]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com//goldkiss2010-ai/python-scene-handoff"
Issues = "https://github.com//goldkiss2010-ai/python-scene-handoff/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_scene_handoff"]

[tool.pytest.ini_options]
addopts = "-q"
